        drawAll();
      }

      // ---------- Duplicate Count ----------
      function countDuplicates() {
        const seen = new Set();
        let dups = 0;
        items().forEach((it) => {
          if (it.type !== "text") return;
          const k = it.value.trim().toLowerCase();
          if (seen.has(k)) dups++; else seen.add(k);
        });
        return dups;
      }

      // ---------- Theme & Language Application ----------
      function applyTheme() {
        document.documentElement.setAttribute("data-theme", state.theme);
        $("themeBtn").textContent = THEME_ICONS[state.theme] || "🌙";
        drawAll();
      }

      function applyLanguage() {
        const tr = t();
        document.documentElement.lang = state.lang;
        document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
        $("brandTitle").innerHTML = tr.brandA + " <span>" + tr.brandB + "</span>";
        $("headerCountLbl").textContent = tr.inList;
        $("langBtn").textContent = tr.langBtn;

        document.querySelectorAll("[data-game]").forEach((b) => {
          b.querySelector(".gname").textContent = tr.games[b.dataset.game].title;
        });
        document.querySelectorAll("[data-speed]").forEach((b) => {
          b.textContent = tr.speed[b.dataset.speed];
          b.classList.toggle("on", b.dataset.speed === state.speed);
        });

        $("listTitleTxt").textContent = tr.yourList;
        $("clearBtn").textContent = tr.clearAll;
        $("newItems").placeholder = tr.placeholder;
        $("addBtn").textContent = "+ " + tr.add;
        $("photoBtnTxt").textContent = tr.addPhotos;
        $("removeToggleLbl").textContent = tr.removeWinner;
        $("confirmClearMsg").textContent = tr.confirmClear;
        $("clearYes").textContent = tr.yesClear;
        $("clearNo").textContent = tr.cancel;
        $("listEditSave").textContent = tr.save;
        $("listEditCancel").textContent = tr.cancel;
        $("listNameInput").placeholder = tr.listNamePh;
        $("listDeleteMsg").textContent = tr.deleteListMsg;
        $("listDeleteYes").textContent = tr.del;
        $("listDeleteNo").textContent = tr.cancel;
        $("exportBtn").textContent = tr.exportJson;
        $("importBtnTxt").textContent = tr.importJson;
        $("restoreAll").textContent = tr.putAllBack;
        $("clearHistoryBtn").textContent = tr.clearHistory;
        $("pickedHint").textContent = tr.pickedHint;
        $("historyHint").textContent = tr.historyHint;
        $("keepBtn").textContent = tr.keepInList;
        $("copyTeamsBtn").textContent = tr.copyResults;
        $("copyOrderBtn").textContent = tr.copyResults;
        $("lblFrom").textContent = tr.from;
        $("lblTo").textContent = tr.to;
        $("coinHeads").textContent = tr.heads;
        $("coinTails").textContent = tr.tails;
        $("tallyReset").textContent = tr.resetCount;
        $("backupTitle").textContent = tr.backupTitle;
        $("backupHint").textContent = tr.backupHint;
        $("backupText").placeholder = tr.pastePh;
        $("copyBackupBtn").textContent = tr.copyBackup;
        $("loadBackupBtn").textContent = tr.loadBackup;
        $("closeBackupBtn").textContent = tr.closeLbl;

        const meta = gMeta(state.game);
        $("stageTitle").textContent = meta.title;
        $("stageSub").textContent = meta.idle;
        paintTeamSeg();
        paintTally();
        if (state.game === "dice") paintDice(false);
        render();
        onListChanged();
      }

      // ---------- List & Sidebar Render ----------
      function startInlineEdit(span, item) {
        if (busy) return;
        const inp = document.createElement("input");
        inp.type = "text";
        inp.className = "inline-edit";
        inp.dir = "auto";
        inp.maxLength = 60;
        inp.value = item.type === "photo" ? (item.name || "") : item.value;
        inp.placeholder = item.type === "photo" ? t().photoNamePh : "";
        span.replaceWith(inp);
        inp.focus();
        inp.select();

        let finished = false;
        function commit() {
          if (finished) return;
          finished = true;
          const v = inp.value.trim();
          if (item.type === "photo") item.name = v;
          else if (v) item.value = v;
          activeList().example = false;
          save(); render(); onListChanged();
        }
        inp.addEventListener("blur", commit);
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); inp.blur(); }
          else if (e.key === "Escape") { finished = true; render(); }
        });
      }

      function render() {
        const listObj = activeList(), arr = listObj.items, pk = listObj.picked, tr = t();

        // Preset select dropdown
        const sel = $("listSelect");
        sel.innerHTML = "";
        state.lists.forEach((l) => {
          const opt = document.createElement("option");
          opt.value = l.id;
          opt.textContent = listDisplayName(l) + " (" + l.items.length + ")";
          if (l.id === state.activeListId) opt.selected = true;
          sel.appendChild(opt);
        });
        $("deleteListBtn").disabled = state.lists.length <= 1;

        // Active items
        const ul = $("items"); ul.innerHTML = "";
        arr.forEach((item, i) => {
          const li = document.createElement("li");
          const sw = document.createElement("span"); sw.className = "swatch"; sw.style.background = colorFor(i, arr.length); li.appendChild(sw);
          if (item.type === "photo") { const im = document.createElement("img"); im.className = "thumb"; im.src = item.value; im.alt = ""; li.appendChild(im); }

          const nm = document.createElement("span");
          nm.className = "name"; nm.dir = "auto"; nm.title = tr.clickToEdit;
          nm.textContent = label(item);
          nm.onclick = () => startInlineEdit(nm, item);
          li.appendChild(nm);

          const w = itemWeight(item);
          const wb = document.createElement("button");
          wb.className = "weight-btn" + (w > 1 ? " weighted" : "");
          wb.textContent = "×" + w;
          wb.title = tr.weightTitle;
          wb.setAttribute("aria-label", tr.weightTitle + " " + w);
          wb.onclick = () => {
            if (busy) return;
            item.weight = w >= 3 ? 1 : w + 1;
            save(); render(); onListChanged();
          };
          li.appendChild(wb);

          const xb = document.createElement("button");
          xb.className = "x"; xb.textContent = "×"; xb.setAttribute("aria-label", "Remove " + label(item));
          xb.onclick = () => {
            if (busy) return;
            arr.splice(i, 1); listObj.example = false;
            save(); render(); onListChanged();
          };
          li.appendChild(xb);
          ul.appendChild(li);
        });

        if (!arr.length) {
          const li = document.createElement("li"); li.className = "empty"; li.textContent = tr.emptyList; ul.appendChild(li);
        }

        $("count").textContent = arr.length ? "(" + arr.length + ")" : "";
        $("headerCountNum").textContent = arr.length;

        const dups = countDuplicates();
        $("dedupBtn").hidden = dups === 0;
        if (dups > 0) $("dedupBtn").textContent = tr.dedup(dups);

        // Tabs labels
        $("tabPicked").textContent = tr.tabPicked + " (" + pk.length + ")";
        $("tabHistory").textContent = tr.tabHistory + " (" + state.history.length + ")";
        $("tabPicked").classList.toggle("on", activeTab === "picked");
        $("tabHistory").classList.toggle("on", activeTab === "history");
        $("tabPicked").setAttribute("aria-selected", String(activeTab === "picked"));
        $("tabHistory").setAttribute("aria-selected", String(activeTab === "history"));
        $("panePicked").hidden = activeTab !== "picked";
        $("paneHistory").hidden = activeTab !== "history";

        // Picked list
        const pl = $("picked"); pl.innerHTML = "";
        $("restoreAll").hidden = pk.length === 0;
        if (!pk.length) {
          const li = document.createElement("li"); li.className = "empty"; li.textContent = tr.emptyPicked; pl.appendChild(li);
        } else {
          pk.forEach((item, i) => {
            const li = document.createElement("li");
            if (item.type === "photo") { const im = document.createElement("img"); im.className = "thumb"; im.src = item.value; im.alt = ""; li.appendChild(im); }
            const nm = document.createElement("span"); nm.className = "name"; nm.dir = "auto"; nm.textContent = label(item); li.appendChild(nm);
            const rb = document.createElement("button"); rb.className = "btn small"; rb.textContent = tr.putBack;
            rb.onclick = () => { if (busy) return; pk.splice(i, 1); arr.push(item); save(); render(); onListChanged(); };
            li.appendChild(rb); pl.appendChild(li);
          });
        }

        // History list
        const hl = $("historyList"); hl.innerHTML = "";
        $("clearHistoryBtn").hidden = state.history.length === 0;
        if (!state.history.length) {
          const li = document.createElement("li"); li.className = "empty"; li.textContent = tr.emptyHistory; hl.appendChild(li);
        } else {
          state.history.forEach((h) => {
            const li = document.createElement("li"); li.className = "hist-item";
            const left = document.createElement("div"); left.className = "hist-left";
            const ic = document.createElement("span"); ic.textContent = ICONS[h.game] || "★";
            const wn = document.createElement("span"); wn.className = "hist-win"; wn.dir = "auto"; wn.textContent = h.label;
            left.append(ic, wn);
            const meta = document.createElement("span"); meta.className = "hist-meta";
            meta.textContent = (tr.games[h.game] ? tr.games[h.game].title : "") + " · " + h.time;
            li.append(left, meta);
            hl.appendChild(li);
          });
        }

        $("removeToggle").checked = state.removeWinner;
        const sb = $("soundBtn");
        sb.innerHTML = state.sound ? SOUND_ON_SVG : SOUND_OFF_SVG;
        sb.classList.toggle("on", state.sound);
        sb.setAttribute("aria-label", state.sound ? "Sound on" : "Sound off");
        refreshAction();
      }

      // ---------- List Actions ----------
      function clearExampleIfNeeded() {
        const l = activeList();
        if (l.example) { l.items = []; l.example = false; }
      }

      function addFromTextarea() {
        if (busy) return;
        const lines = $("newItems").value.split(/\r?\n|,|،/).map((s) => s.trim()).filter(Boolean);
        if (!lines.length) { $("newItems").focus(); return; }
        clearExampleIfNeeded();
        lines.forEach((v) => items().push({ id: uid(), type: "text", value: v.slice(0, 60), name: "", weight: 1 }));
        $("newItems").value = "";
        save(); render(); onListChanged();
        setStatus(gMeta(state.game).idle);
      }

      $("addBtn").onclick = addFromTextarea;
      $("newItems").addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); addFromTextarea(); }
      });

      $("dedupBtn").onclick = () => {
        if (busy) return;
        const seen = new Set();
        let removed = 0;
        activeList().items = items().filter((it) => {
          if (it.type !== "text") return true;
          const k = it.value.trim().toLowerCase();
          if (seen.has(k)) { removed++; return false; }
          seen.add(k); return true;
        });
        save(); render(); onListChanged();
        setStatus(t().dedupDone(removed));
      };

      function shrink(file) {
        return new Promise((resolve) => {
          const url = URL.createObjectURL(file);
          const im = new Image();
          im.onload = () => {
            const max = 240, s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
            const cv = document.createElement("canvas");
            cv.width = Math.round(im.naturalWidth * s); cv.height = Math.round(im.naturalHeight * s);
            cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
            URL.revokeObjectURL(url);
            resolve(cv.toDataURL("image/jpeg", 0.8));
          };
          im.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
          im.src = url;
        });
      }

      $("photoInput").onchange = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length || busy) return;
        setStatus(t().addingPhotos(files.length));
        clearExampleIfNeeded();
        for (const f of files) {
          const data = await shrink(f);
          if (data) items().push({ id: uid(), type: "photo", value: data, name: "", weight: 1 });
        }
        e.target.value = "";
        save(); render(); onListChanged();
        setStatus(gMeta(state.game).idle);
      };

      // Preset List CRUD (Inline UI, no prompt/confirm)
      $("listSelect").onchange = (e) => {
        if (busy) return;
        state.activeListId = e.target.value;
        $("listEditBar").hidden = true;
        $("listDeleteBar").hidden = true;
        save(); render(); onListChanged();
      };

      $("newListBtn").onclick = () => {
        if (busy) return;
        listEditMode = "new";
        $("listDeleteBar").hidden = true;
        $("listNameInput").value = "";
        $("listEditBar").hidden = false;
        $("listNameInput").focus();
      };

      $("renameListBtn").onclick = () => {
        if (busy) return;
        listEditMode = "rename";
        $("listDeleteBar").hidden = true;
        $("listNameInput").value = listDisplayName(activeList());
        $("listEditBar").hidden = false;
        $("listNameInput").focus();
        $("listNameInput").select();
      };

      function saveListEdit() {
        const name = $("listNameInput").value.trim();
        if (!name) { $("listNameInput").focus(); return; }
        if (listEditMode === "new") {
          const id = uid();
          state.lists.push({ id, name, example: false, items: [], picked: [] });
          state.activeListId = id;
        } else if (listEditMode === "rename") {
          activeList().name = name;
        }
        $("listEditBar").hidden = true;
        listEditMode = null;
        save(); render(); onListChanged();
      }

      $("listEditSave").onclick = saveListEdit;
      $("listEditCancel").onclick = () => { $("listEditBar").hidden = true; listEditMode = null; };
      $("listNameInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); saveListEdit(); }
        else if (e.key === "Escape") { $("listEditBar").hidden = true; listEditMode = null; }
      });

      $("deleteListBtn").onclick = () => {
        if (busy || state.lists.length <= 1) return;
        $("listEditBar").hidden = true;
        $("listDeleteBar").hidden = false;
      };
      $("listDeleteNo").onclick = () => { $("listDeleteBar").hidden = true; };
      $("listDeleteYes").onclick = () => {
        if (busy || state.lists.length <= 1) return;
        state.lists = state.lists.filter((l) => l.id !== state.activeListId);
        state.activeListId = state.lists[0].id;
        $("listDeleteBar").hidden = true;
        save(); render(); onListChanged();
      };

      // Export / Import JSON Backup
      // Export: try a file download (works when the page is opened as a file),
      // and always show the backup as text, because some pages block downloads.
      $("exportBtn").onclick = async () => {
        const payload = JSON.stringify({ version: 2, lists: state.lists, history: state.history });
        $("backupText").value = payload;
        // Inside the Claude page, files are saved through the viewer's own save prompt.
        let dl = null;
        try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
        if (dl) {
          try {
            await dl.save({ filename: "lucky-picker-backup.json", data: payload });
            $("backupBox").hidden = true;
            setStatus(t().exported);
          } catch (e) {
            $("backupBox").hidden = false;
            setStatus(t().exportReady);
          }
          return;
        }
        try {
          const blob = new Blob([payload], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = "lucky-picker-backup.json";
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (e) {}
        $("backupText").value = payload;
        $("backupBox").hidden = false;
        setStatus(t().exportReady);
      };

      function importBackupText(text) {
        try {
          const data = JSON.parse(String(text));
          if (!Array.isArray(data.lists) || !data.lists.length) throw new Error("bad");
          state.lists = data.lists.map((l) => ({
            id: l.id || uid(),
            name: String(l.name || "Imported").slice(0, 40),
            example: false,
            items: (l.items || []).map(normalizeItem),
            picked: (l.picked || []).map(normalizeItem)
          }));
          state.activeListId = state.lists[0].id;
          if (Array.isArray(data.history)) state.history = data.history.slice(0, 60);
          save(); render(); onListChanged();
          setStatus(t().imported);
          return true;
        } catch (err) {
          setStatus(t().importErr);
          return false;
        }
      }

      $("importInput").onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file || busy) return;
        const reader = new FileReader();
        reader.onload = () => { importBackupText(reader.result); e.target.value = ""; };
        reader.readAsText(file);
      };

      $("copyBackupBtn").onclick = () => copyText($("backupText").value, $("copyBackupBtn"), t().copyBackup);
      $("loadBackupBtn").onclick = () => {
        if (busy) return;
        if (importBackupText($("backupText").value)) $("backupBox").hidden = true;
      };
      $("closeBackupBtn").onclick = () => { $("backupBox").hidden = true; };

      // Copy Results for Teams & Order
      $("copyTeamsBtn").onclick = () => {
        if (!lastTeamsResult) return;
        const text = lastTeamsResult
          .map((members, i) => t().teamLabel(i + 1) + ":\n" + members.map((m) => "• " + label(m)).join("\n"))
          .join("\n\n");
        copyText(text, $("copyTeamsBtn"));
      };

      $("copyOrderBtn").onclick = () => {
        if (!lastOrderResult) return;
        const text = lastOrderResult.map((m, i) => (i + 1) + ". " + label(m)).join("\n");
        copyText(text, $("copyOrderBtn"));
      };

      // ---------- Header & Misc Controls ----------
      $("langBtn").onclick = () => {
        state.lang = state.lang === "en" ? "ar" : "en";
        save(); applyLanguage();
      };

      $("themeBtn").onclick = () => {
        const idx = (THEMES.indexOf(state.theme) + 1) % THEMES.length;
        state.theme = THEMES[idx];
        save(); applyTheme();
      };

      $("bigBtn").onclick = () => {
        bigScreen = !bigScreen;
        updateLayoutVisibility();
        try {
          if (bigScreen && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
          else if (!bigScreen && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
        } catch (e) {}
      };

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement && bigScreen) {
          bigScreen = false;
          updateLayoutVisibility();
        }
      });

      $("soundBtn").onclick = () => {
        state.sound = !state.sound; save(); render();
        if (state.sound) tone(880, 0.08, "triangle", 0.08);
      };

      document.querySelectorAll("[data-speed]").forEach((b) => {
        b.onclick = () => {
          state.speed = b.dataset.speed; save();
          document.querySelectorAll("[data-speed]").forEach((x) => x.classList.toggle("on", x.dataset.speed === state.speed));
        };
      });

      $("removeToggle").onchange = (e) => { state.removeWinner = e.target.checked; save(); };
      $("clearBtn").onclick = () => { $("confirmClear").hidden = false; };
      $("clearNo").onclick = () => { $("confirmClear").hidden = true; };
      $("clearYes").onclick = () => {
        if (busy) return;
        const l = activeList();
        l.items = []; l.picked = []; l.example = false;
        $("confirmClear").hidden = true;
        save(); render(); onListChanged(); setStatus("");
      };
      $("restoreAll").onclick = () => {
        if (busy) return;
        const l = activeList();
        l.items = l.items.concat(l.picked.reverse()); l.picked = [];
        save(); render(); onListChanged();
      };
      $("clearHistoryBtn").onclick = () => { state.history = []; save(); render(); };

      $("tabPicked").onclick = () => { activeTab = "picked"; render(); };
      $("tabHistory").onclick = () => { activeTab = "history"; render(); };

      document.querySelectorAll("[data-game]").forEach((b) => { b.onclick = () => showGame(b.dataset.game); });
      document.querySelectorAll("[data-teams]").forEach((b) => {
        b.onclick = () => { if (!busy) { state.teamCount = +b.dataset.teams; save(); teamsPlaceholder(); refreshAction(); } };
      });
      $("tallyReset").onclick = () => { state.coinTally = { h: 0, t: 0 }; save(); paintTally(); };
      ["numMin", "numMax"].forEach((id) =>
        $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); audio(); pickNumber(); } })
      );
      document.querySelectorAll("[data-range]").forEach((b) => {
        b.onclick = () => {
          if (busy) return;
          const [mn, mx] = b.dataset.range.split(",").map(Number);
          state.numMin = mn; state.numMax = mx;
          $("numMin").value = mn; $("numMax").value = mx;
          save(); setStatus(t().rangeSet(mn, mx));
        };
      });
      document.querySelectorAll("[data-dice]").forEach((b) => {
        b.onclick = () => { if (!busy) setDiceCount(+b.dataset.dice); };
      });
      $("actionBtn").onclick = () => { audio(); play(); };
      wheelCv.onclick = () => { audio(); spinWheel(); };
      bottleCv.onclick = () => { audio(); spinBottle(); };

      function closePopup() { $("overlay").hidden = true; stopConfetti(); onListChanged(); }
      $("againBtn").onclick = () => {
        closePopup();
        if (!items().length) return;
        const g = state.game;
        if (g === "cards" || g === "boxes") mix(g); else play();
      };
      $("keepBtn").onclick = () => {
        if (lastWin && lastWin.removed) {
          const pk = picked(), k = pk.indexOf(lastWin.item);
          if (k > -1) pk.splice(k, 1);
          items().splice(Math.min(lastWin.index, items().length), 0, lastWin.item);
          lastWin.removed = false; save(); render();
        }
        closePopup();
      };
      $("overlay").onclick = (e) => { if (e.target.id === "overlay") closePopup(); };
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("overlay").hidden) closePopup(); });

      // Boot
      load();
      applyTheme();
      applyLanguage();
      window.addEventListener("resize", resize);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll);
      showGame(state.game, true);
    })();
  </script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
