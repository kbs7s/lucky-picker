<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="claude:viewport-fit-sides" content="cover">
  <title>Lucky Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Cairo:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    /* ==========================================================================
       Theme Tokens: Arcade Dark (default), Clean Light, Neon Party
       ========================================================================== */
    :root,
    [data-theme="dark"] {
      --bg: #0e1018;
      --bg-glow-1: rgba(255, 201, 74, 0.12);
      --bg-glow-2: rgba(67, 170, 139, 0.08);
      --bg-surface: #171a26;
      --bg-elevated: #202436;
      --bg-inset: #10131d;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);
      --fg: #f4f1ea;
      --muted: #9498ad;
      --accent: #ffc94a;
      --accent-2: #f59e0b;
      --accent-ink: #241600;
      --accent-deep: #9c6500;
      --accent-glow: rgba(255, 201, 74, 0.28);
      --felt-1: #17463a;
      --felt-2: #0d2b22;
      --felt-stitch: rgba(255, 224, 150, 0.24);
      --card-back: #c83247;
      --card-back-2: #982134;
      --card-face: #fbf7ee;
      --card-ink: #1a1409;
      --danger: #f05252;
      --shadow-card: 0 18px 42px -16px rgba(0, 0, 0, 0.65), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
      --popup-bg: linear-gradient(180deg, #1d2133 0%, #141724 100%);
      --slot-shell: linear-gradient(180deg, #b8293f 0%, #7d1727 100%);
      --display: "Bricolage Grotesque", "Cairo", "Segoe UI", system-ui, sans-serif;
      --body: "Figtree", "Cairo", "Segoe UI", system-ui, sans-serif;
      color-scheme: dark;
    }

    [data-theme="light"] {
      --bg: #f6f4ef;
      --bg-glow-1: rgba(245, 158, 11, 0.12);
      --bg-glow-2: rgba(23, 70, 58, 0.07);
      --bg-surface: #ffffff;
      --bg-elevated: #f1efe9;
      --bg-inset: #f6f5f0;
      --border: rgba(15, 23, 42, 0.09);
      --border-strong: rgba(15, 23, 42, 0.16);
      --fg: #181b26;
      --muted: #5d6478;
      --accent: #f5b82e;
      --accent-2: #d98a00;
      --accent-ink: #241600;
      --accent-deep: #965d00;
      --accent-glow: rgba(217, 138, 0, 0.26);
      --felt-1: #1b5747;
      --felt-2: #10382d;
      --felt-stitch: rgba(255, 230, 165, 0.3);
      --card-back: #c83247;
      --card-back-2: #982134;
      --card-face: #fbf7ee;
      --card-ink: #1a1409;
      --danger: #dc2626;
      --shadow-card: 0 14px 32px -14px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(15, 23, 42, 0.05);
      --popup-bg: linear-gradient(180deg, #ffffff 0%, #f9f7f2 100%);
      --slot-shell: linear-gradient(180deg, #c62e45 0%, #89192b 100%);
      color-scheme: light;
    }

    [data-theme="neon"] {
      --bg: #0b0718;
      --bg-glow-1: rgba(244, 63, 212, 0.16);
      --bg-glow-2: rgba(34, 211, 238, 0.12);
      --bg-surface: #140e29;
      --bg-elevated: #1e153b;
      --bg-inset: #0e0920;
      --border: rgba(244, 63, 212, 0.22);
      --border-strong: rgba(34, 211, 238, 0.34);
      --fg: #f8f5ff;
      --muted: #a69cc8;
      --accent: #22d3ee;
      --accent-2: #e879f9;
      --accent-ink: #090514;
      --accent-deep: #86198f;
      --accent-glow: rgba(34, 211, 238, 0.35);
      --felt-1: #3b1768;
      --felt-2: #1c0938;
      --felt-stitch: rgba(34, 211, 238, 0.32);
      --card-back: #d946ef;
      --card-back-2: #9333ea;
      --card-face: #fdfaff;
      --card-ink: #190d2d;
      --danger: #fb7185;
      --shadow-card: 0 18px 46px -14px rgba(0, 0, 0, 0.78), 0 0 0 1px rgba(244, 63, 212, 0.14);
      --popup-bg: linear-gradient(180deg, #1d133c 0%, #120b26 100%);
      --slot-shell: linear-gradient(180deg, #a21caf 0%, #581c87 100%);
      color-scheme: dark;
    }

    html[lang="ar"] {
      --display: "Cairo", "Bricolage Grotesque", system-ui, sans-serif;
      --body: "Cairo", "Figtree", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden]:not([hidden="until-found" i]) { display: none !important; }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      background: var(--bg);
      color: var(--fg);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.45;
      color: var(--fg);
      background:
        radial-gradient(920px 460px at 50% -120px, var(--bg-glow-1), transparent 65%),
        radial-gradient(640px 420px at 15% 18%, var(--bg-glow-2), transparent 60%),
        var(--bg);
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    img { max-width: 100%; display: block; }
    button, input, textarea, select { font-family: inherit; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ==========================================================================
       Shell & Responsive Workspace
       ========================================================================== */
    .app {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-top: 14px;
      padding-bottom: 44px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .app.big-screen {
      max-width: 960px;
    }

    /* Top Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 2px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      color: var(--accent-ink);
      display: grid;
      place-items: center;
      flex: none;
      box-shadow: 0 6px 18px -4px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .brand h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(20px, 3vw, 25px);
      margin: 0;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand h1 span {
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-stat {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .pill-stat strong { color: var(--fg); font-weight: 700; }

    .ctrl-btn {
      height: 38px;
      min-width: 38px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.16s, border-color 0.16s, transform 0.12s, color 0.16s;
    }

    .ctrl-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--accent);
    }

    .ctrl-btn:active { transform: scale(0.95); }

    .ctrl-btn.on {
      color: var(--accent);
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, var(--bg-surface));
    }

    /* Game Selector Ribbon */
    .games-wrap {
      position: relative;
      margin-inline: -4px;
    }

    .games-wrap::before,
    .games-wrap::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 22px;
      pointer-events: none;
      z-index: 2;
    }

    .games-wrap::before {
      inset-inline-start: 0;
      background: linear-gradient(90deg, var(--bg), transparent);
    }

    .games-wrap::after {
      inset-inline-end: 0;
      background: linear-gradient(270deg, var(--bg), transparent);
    }

    html[dir="rtl"] .games-wrap::before {
      background: linear-gradient(270deg, var(--bg), transparent);
    }

    html[dir="rtl"] .games-wrap::after {
      background: linear-gradient(90deg, var(--bg), transparent);
    }

    .games {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 12px;
      scroll-behavior: smooth;
    }

    .games::-webkit-scrollbar { display: none; }

    .chip {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--bg-surface);
      transition: background 0.16s, color 0.16s, border-color 0.16s, transform 0.12s, box-shadow 0.2s;
    }

    .chip .ico { font-size: 15px; line-height: 1; }

    .chip:hover:not(.on) {
      color: var(--fg);
      background: var(--bg-elevated);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .chip.on {
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: var(--accent-ink);
      border-color: transparent;
      font-weight: 700;
      box-shadow: 0 6px 20px -4px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    /* Main 2-Column Grid */
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    @media (min-width: 920px) {
      .workspace {
        grid-template-columns: minmax(0, 1fr) 370px;
        gap: 24px;
      }

      .workspace.centered {
        grid-template-columns: minmax(0, 760px);
        justify-content: center;
      }

      .sidebar {
        position: sticky;
        top: 16px;
        max-height: calc(100dvh - 32px);
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--border-strong) transparent;
      }
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ==========================================================================
       Elevated Stage Card + Speed Control
       ========================================================================== */
    .stage-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .stage-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .stage-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 19px;
      flex: none;
    }

    .stage-title {
      font-family: var(--display);
      font-weight: 700;
      font-size: 19px;
      margin: 0;
      line-height: 1.15;
    }

    .stage-sub {
      color: var(--muted);
      font-size: 13px;
      margin: 2px 0 0;
    }

    .speed-seg {
      display: inline-flex;
      gap: 3px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      padding: 3px;
      border-radius: 999px;
    }

    .speed-seg button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .speed-seg button:hover:not(.on) { color: var(--fg); }

    .speed-seg button.on {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .stage-body {
      display: grid;
      place-items: center;
      min-height: 240px;
      padding: 4px 0;
    }

    .stage {
      position: relative;
      width: 100%;
      display: grid;
      place-items: center;
    }

    /* Tactile Primary Action Button */
    .action-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action {
      position: relative;
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 16px 20px;
      cursor: pointer;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
      color: var(--accent-ink);
      font-family: var(--display);
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.02em;
      box-shadow:
        0 6px 0 var(--accent-deep),
        0 12px 28px -6px var(--accent-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease, opacity 0.15s ease;
    }

    .action:hover:not(:disabled) { filter: brightness(1.06); }

    .action:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 var(--accent-deep),
        0 6px 14px -4px var(--accent-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .action:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.25);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
    }

    .status {
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 500;
      min-height: 1.45em;
    }

    /* ==========================================================================
       Shared Felt Table Surface
       ========================================================================== */
    .felt-surface {
      background: radial-gradient(circle at 50% 28%, var(--felt-1), var(--felt-2));
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        inset 0 0 0 6px rgba(0, 0, 0, 0.18),
        inset 0 0 0 7px var(--felt-stitch),
        inset 0 18px 40px rgba(0, 0, 0, 0.32);
    }

    /* ==========================================================================
       Wheel & Knockout
       ========================================================================== */
    .round-canvas {
      width: 100%;
      max-width: 430px;
      aspect-ratio: 1;
      display: block;
      touch-action: manipulation;
      cursor: pointer;
    }

    .app.big-screen .round-canvas {
      max-width: 500px;
    }

    .pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 34px;
      height: 36px;
      z-index: 3;
      filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.55));
      pointer-events: none;
    }

    .ko-out {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 14px;
      width: 100%;
    }

    .ko-out span {
      font-size: 12.5px;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--muted);
      text-decoration: line-through;
    }

    /* ==========================================================================
       Slots
       ========================================================================== */
    .slot {
      width: 100%;
      max-width: 400px;
      background: var(--slot-shell);
      border-radius: 26px;
      padding: 16px 18px 18px;
      border: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.22),
        inset 0 -8px 0 rgba(0, 0, 0, 0.28),
        0 14px 32px rgba(0, 0, 0, 0.4);
    }

    .slot-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: var(--display);
      font-weight: 800;
      letter-spacing: 0.18em;
      color: var(--accent);
      font-size: 13px;
      margin-bottom: 12px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    .slot-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .slot-window {
      position: relative;
      height: 264px;
      overflow: hidden;
      border-radius: 14px;
      background: var(--card-face);
      border: 3px solid rgba(0, 0, 0, 0.45);
      box-shadow:
        inset 0 22px 24px -12px rgba(0, 0, 0, 0.52),
        inset 0 -22px 24px -12px rgba(0, 0, 0, 0.52);
    }

    .strip {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      will-change: transform;
    }

    .cell {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 24px;
      color: var(--card-ink);
      font-weight: 700;
      font-size: 22px;
      border-bottom: 1px dashed rgba(27, 20, 7, 0.16);
    }

    .cell img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 10px;
      flex: none;
    }

    .cell span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .payline {
      position: absolute;
      left: 0;
      right: 0;
      top: 88px;
      height: 88px;
      border-top: 3px solid var(--accent);
      border-bottom: 3px solid var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      pointer-events: none;
    }

    .payline::before,
    .payline::after {
      content: "";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
    }

    .payline::before { left: 0; border-left: 12px solid var(--accent); }
    .payline::after { right: 0; border-right: 12px solid var(--accent); }

    /* ==========================================================================
       Cards, 3 Cards & Gift Boxes
       ========================================================================== */
    .grid {
      width: 100%;
      display: grid;
      gap: 10px;
      padding: 16px;
      border-radius: 22px;
    }

    .grid.cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .grid.boxes {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
    }

    .pick {
      position: relative;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
      perspective: 700px;
      font: inherit;
      color: inherit;
      transition: transform 0.16s ease, opacity 0.25s ease;
    }

    @media (hover: hover) {
      .pick:hover:not(:disabled):not(.open) { transform: translateY(-4px); }
    }
    .pick:disabled { cursor: default; }

    .pcard { aspect-ratio: 5 / 7; }

    .pcard .inner {
      position: absolute;
      inset: 0;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }

    .pcard.open .inner { transform: rotateY(180deg); }

    .pcard .face,
    .pcard .back {
      position: absolute;
      inset: 0;
      border-radius: 11px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
    }

    .pcard .back {
      background: repeating-linear-gradient(45deg, var(--card-back) 0 6px, var(--card-back-2) 6px 12px);
      border: 3px solid var(--card-face);
    }

    .pcard .back::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 6px;
      border: 1px solid rgba(255, 224, 150, 0.45);
    }

    .pcard .back::after {
      content: "?";
      font-family: var(--display);
      font-weight: 800;
      color: var(--card-face);
      font-size: 22px;
    }

    .pcard .face {
      background: var(--card-face);
      color: var(--card-ink);
      transform: rotateY(180deg);
      padding: 6px;
      font-weight: 700;
      font-size: 13px;
      text-align: center;
      overflow-wrap: anywhere;
      border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
    }

    .pcard .face img { width: 100%; height: 100%; object-fit: cover; border-radius: 7px; }

    .pcard.shuffle { animation: riffle 0.9s ease-in-out; }
    @keyframes riffle {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      35% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); }
      65% { transform: translate(calc(var(--dx) * -0.4), calc(var(--dy) * -0.4)) rotate(calc(var(--rot) * -1)); }
    }

    .pcard.dim, .gbox.dim { opacity: 0.3; }

    /* 3 Cards */
    .three {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 3 / 2;
      border-radius: 22px;
    }

    .three .pick {
      position: absolute;
      top: 18%;
      width: 28%;
      transition: left 0.3s ease-in-out, transform 0.3s ease;
    }

    .three .pick.lift { transform: translateY(-16px) scale(1.05); z-index: 2; }
    .three .pcard .face { font-size: 15px; }

    .three-msg {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(251, 247, 238, 0.92);
      font-weight: 600;
      padding: 20px;
      text-align: center;
    }

    /* Gift Boxes */
    .gbox { aspect-ratio: 1; }

    .gbox .body {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 0;
      height: 66%;
      border-radius: 10px;
      background: var(--c);
      box-shadow: inset 0 -10px 0 rgba(0, 0, 0, 0.2), 0 8px 16px rgba(0, 0, 0, 0.25);
    }

    .gbox .body::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 17%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #ffe082, var(--accent), #e09c14);
    }

    .gbox .lid {
      position: absolute;
      left: 2%;
      right: 2%;
      top: 18%;
      height: 21%;
      border-radius: 7px;
      background: var(--c);
      filter: brightness(1.12);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.22);
      transition: transform 0.45s cubic-bezier(0.3, 1.6, 0.5, 1);
      transform-origin: 10% 100%;
      z-index: 2;
    }

    .gbox .lid::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 17%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #ffe082, var(--accent), #e09c14);
    }

    .gbox .lid::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -62%;
      width: 48%;
      height: 72%;
      transform: translateX(-50%);
      border: 5px solid var(--accent);
      border-radius: 50% 50% 10% 10%;
      border-bottom: 0;
    }

    .gbox.open .lid { transform: translate(-20%, -56%) rotate(-30deg); }

    .gbox .prize {
      position: absolute;
      left: 13%;
      right: 13%;
      bottom: 26%;
      height: 58%;
      display: grid;
      place-items: center;
      background: var(--card-face);
      color: var(--card-ink);
      border-radius: 10px;
      border: 2px solid var(--accent);
      font-weight: 700;
      font-size: 13px;
      text-align: center;
      padding: 4px;
      overflow: hidden;
      overflow-wrap: anywhere;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      transform: translateY(40%) scale(0.6);
      opacity: 0;
      transition: transform 0.45s 0.14s cubic-bezier(0.3, 1.6, 0.5, 1), opacity 0.2s 0.14s;
      z-index: 1;
    }

    .gbox .prize img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
    .gbox.open .prize { transform: translateY(-24%) scale(1.03); opacity: 1; z-index: 3; }

    .gbox.wobble { animation: wobble 0.5s ease-in-out; }
    @keyframes wobble {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-7deg); }
      75% { transform: rotate(7deg); }
    }

    /* ==========================================================================
       Dice, Coin & Number (Felt Stages)
       ========================================================================== */
    .dice-stage {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 26px 18px;
      border-radius: 22px;
    }

    .dice {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      min-height: 98px;
      align-items: center;
    }

    .die {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      background: linear-gradient(145deg, #ffffff 0%, #f5efe2 100%);
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 13px;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.9),
        inset 0 -7px 0 rgba(0, 0, 0, 0.13),
        0 10px 20px rgba(0, 0, 0, 0.38);
    }

    .die i {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #3c3428, #141009);
      place-self: center;
      visibility: hidden;
      box-shadow: inset 0 2px 2px rgba(0, 0, 0, 0.5);
    }

    .die i.on { visibility: visible; }
    .die.one i.on { background: radial-gradient(circle at 35% 35%, #e8505b, #a81d2b); width: 20px; height: 20px; }

    .die.roll { animation: tumble 0.18s linear infinite; }
    @keyframes tumble {
      0% { transform: rotate(0) translateY(0); }
      50% { transform: rotate(16deg) translateY(-7px); }
      100% { transform: rotate(-6deg) translateY(0); }
    }

    .dice-total {
      font-family: var(--display);
      font-weight: 800;
      font-size: 32px;
      color: var(--card-face);
      min-height: 1.2em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }

    .seg {
      display: inline-flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.32);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .seg button {
      border: 0;
      background: transparent;
      color: rgba(251, 247, 238, 0.85);
      font-weight: 600;
      font-size: 13.5px;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .seg button:hover:not(.on) { color: #fff; }
    .seg button.on { background: var(--card-face); color: var(--card-ink); font-weight: 700; }

    .seg.dark { background: var(--bg-inset); border: 1px solid var(--border); }
    .seg.dark button { color: var(--muted); }
    .seg.dark button.on { background: var(--accent); color: var(--accent-ink); }

    /* Coin */
    .coin-wrap { perspective: 900px; padding: 10px 0; }
    .coin-wrap.toss { animation: toss var(--toss-dur, 1.8s) cubic-bezier(0.3, 0.6, 0.4, 1); }
    @keyframes toss {
      0% { transform: translateY(0); }
      40% { transform: translateY(-92px); }
      80% { transform: translateY(0); }
      90% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    .coin {
      width: 164px;
      height: 164px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.8s cubic-bezier(0.2, 0.7, 0.2, 1);
      filter: drop-shadow(0 14px 20px rgba(0, 0, 0, 0.45));
    }

    .coin .side {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      font-family: var(--display);
      font-weight: 800;
      font-size: 25px;
      letter-spacing: 0.06em;
      color: #543700;
      background: radial-gradient(circle at 32% 28%, #fff3c4, #ffd25a 48%, #c98f0c 100%);
      box-shadow:
        inset 0 0 0 8px rgba(255, 255, 255, 0.28),
        inset 0 0 0 11px #c48b0a,
        inset 0 0 0 14px rgba(255, 240, 180, 0.35);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .coin .tails {
      transform: rotateY(180deg);
      color: #262936;
      background: radial-gradient(circle at 32% 28%, #ffffff, #cdd2df 50%, #83899b 100%);
      box-shadow:
        inset 0 0 0 8px rgba(255, 255, 255, 0.34),
        inset 0 0 0 11px #7e8496,
        inset 0 0 0 14px rgba(255, 255, 255, 0.22);
    }

    .felt-text {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      color: rgba(251, 247, 238, 0.9);
      font-weight: 600;
      font-size: 14px;
    }

    /* Number */
    .num-range {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .num-range label {
      color: rgba(251, 247, 238, 0.9);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .num-range input {
      width: 104px;
      font-size: 16px;
      font-weight: 700;
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.32);
      color: var(--card-face);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .presets {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .preset-btn {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.24);
      color: rgba(251, 247, 238, 0.9);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .preset-btn:hover {
      background: rgba(255, 201, 74, 0.24);
      border-color: var(--accent);
      color: #fff;
    }

    .big-num {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(56px, 16vw, 102px);
      line-height: 1;
      color: var(--card-face);
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
      text-align: center;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      padding: 6px 0;
    }

    .num-hist {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .num-hist span {
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--card-face);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       Scratch Card
       ========================================================================== */
    .ticket {
      position: relative;
      width: 100%;
      max-width: 370px;
      aspect-ratio: 4 / 3;
      border-radius: 20px;
      overflow: hidden;
      background: var(--card-face);
      color: var(--card-ink);
      border: 4px dashed var(--accent);
      box-shadow: 0 10px 0 var(--accent-deep), 0 18px 34px rgba(0, 0, 0, 0.38);
    }

    .prize2 {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      text-align: center;
      font-family: var(--display);
      font-weight: 800;
      font-size: 30px;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .prize2 img { width: 50%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; }

    .prize2 small {
      font-family: var(--body);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8a6a10;
      font-weight: 700;
    }

    #scratchCv {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    /* ==========================================================================
       Teams & Order + Copy Results Bar
       ========================================================================== */
    .teams-wrap,
    .order-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .stage-toolbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .teams {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .team {
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-top: 3px solid var(--c);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .team h3 {
      margin: 0 0 2px;
      font-family: var(--display);
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team h3 i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }

    .team .m {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      min-width: 0;
      overflow-wrap: anywhere;
      animation: dealIn 0.3s ease-out both;
    }

    .team .m img { width: 30px; height: 30px; border-radius: 7px; object-fit: cover; flex: none; }

    @keyframes dealIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.95); }
      to { opacity: 1; transform: none; }
    }

    .order-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .orow {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 14px;
      min-width: 0;
      animation: dealIn 0.3s ease-out both;
    }

    .orow b {
      font-family: var(--display);
      font-size: 20px;
      color: var(--accent);
      min-width: 2ch;
      text-align: end;
      flex: none;
      font-variant-numeric: tabular-nums;
    }

    .orow img { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; flex: none; }
    .orow span { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }

    /* ==========================================================================
       Race
       ========================================================================== */
    .track {
      width: 100%;
      border-radius: 18px;
      padding: 12px 30px 12px 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      background: repeating-linear-gradient(90deg, #275e38 0 42px, #225431 42px 84px);
      border: 2px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 6px 18px rgba(0, 0, 0, 0.32);
      direction: ltr;
    }

    .lane {
      position: relative;
      height: 44px;
      border-bottom: 1.5px dashed rgba(255, 255, 255, 0.2);
    }

    .lane:nth-last-child(2) { border-bottom: 0; }

    .runner {
      position: absolute;
      top: 5px;
      left: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      border: 2.5px solid #fff;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.38);
      will-change: transform;
      z-index: 2;
    }

    .runner img { width: 100%; height: 100%; object-fit: cover; }

    .lname {
      position: absolute;
      left: 46px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.88);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 62%;
      pointer-events: none;
    }

    .finish {
      position: absolute;
      top: 10px;
      bottom: 10px;
      right: 12px;
      width: 12px;
      border-radius: 3px;
      background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0 / 12px 12px;
    }

    .lane.won { background: linear-gradient(90deg, transparent, rgba(255, 201, 74, 0.25)); border-radius: 8px; }
    .lane.won .runner { box-shadow: 0 0 0 4px var(--accent), 0 0 16px var(--accent-glow); }

    /* ==========================================================================
       Sidebar Panels, List Presets, Inline Editing, Weights & Tabs
       ========================================================================== */
    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel h2 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 16.5px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .count {
      color: var(--muted);
      font-weight: 500;
      font-size: 12.5px;
      font-family: var(--body);
    }

    .row { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
    .row.between { justify-content: space-between; }
    .row.nowrap { flex-wrap: nowrap; }

    /* List Presets Selector Bar */
    .preset-bar {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .preset-select {
      flex: 1;
      min-width: 0;
      height: 36px;
      padding: 0 10px;
      border-radius: 10px;
      background: var(--bg-inset);
      color: var(--fg);
      border: 1px solid var(--border-strong);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .icon-sm {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--bg-elevated);
      color: var(--fg);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: none;
      transition: background 0.14s, border-color 0.14s, color 0.14s;
    }

    .icon-sm:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .icon-sm:disabled { opacity: 0.35; cursor: not-allowed; }

    .inline-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 8px;
      border-radius: 11px;
      background: var(--bg-inset);
      border: 1px solid var(--border-strong);
    }

    .inline-bar input {
      flex: 1;
      min-width: 0;
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--fg);
      font-size: 13.5px;
    }

    textarea {
      width: 100%;
      min-height: 74px;
      max-height: 170px;
      resize: vertical;
      background: var(--bg-inset);
      color: var(--fg);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 14px;
      line-height: 1.4;
      transition: border-color 0.15s;
    }

    textarea::placeholder { color: var(--muted); opacity: 0.75; }
    textarea:focus { border-color: var(--accent); outline: none; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg-elevated);
      color: var(--fg);
      border: 1px solid var(--border-strong);
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .btn:hover:not(:disabled) { border-color: var(--accent); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn.primary {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
      font-weight: 700;
    }

    .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .btn.ghost:hover { background: var(--bg-elevated); color: var(--fg); }

    .btn.danger {
      background: color-mix(in srgb, var(--danger) 15%, transparent);
      border-color: color-mix(in srgb, var(--danger) 40%, transparent);
      color: var(--danger);
    }

    .btn.small { padding: 5px 10px; font-size: 12.5px; border-radius: 9px; }

    label.btn { position: relative; }
    label.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }

    .hint { color: var(--muted); font-size: 12.5px; }

    /* Custom Switch Toggle */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      user-select: none;
    }

    .switch { position: relative; width: 40px; height: 22px; flex: none; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }

    .switch-track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      transition: background 0.2s ease;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.2s cubic-bezier(0.3, 1.4, 0.5, 1), background 0.2s;
    }

    .switch input:checked + .switch-track { background: var(--accent); border-color: var(--accent); }
    .switch input:checked + .switch-track::after { transform: translateX(18px); background: var(--accent-ink); }

    /* Confirm Clear Box */
    .confirm-box {
      padding: 9px 11px;
      border-radius: 11px;
      background: color-mix(in srgb, var(--danger) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    }

    /* Item List with Inline Editing & Weight Pills */
    .items {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
      padding-inline-end: 2px;
    }

    .items li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 6px 6px 9px;
      border-radius: 11px;
      background: var(--bg-inset);
      border: 1px solid transparent;
      min-width: 0;
      transition: border-color 0.14s, background 0.14s;

    .items li:hover { border-color: var(--border); }

    .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .thumb { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; flex: none; }

    .items .name {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 13.5px;
      font-weight: 500;
      cursor: text;
      padding: 2px 4px;
      border-radius: 6px;
    }

    .items .name:hover { background: var(--bg-elevated); }

    .inline-edit {
      flex: 1;
      min-width: 0;
      height: 28px;
      padding: 0 7px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--bg-surface);
      color: var(--fg);
      font-size: 13.5px;
      font-weight: 500;
    }

    .weight-btn {
      flex: none;
      height: 26px;
      min-width: 34px;
      padding: 0 7px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
      transition: background 0.14s, color 0.14s, border-color 0.14s;

    .weight-btn.weighted {
      background: color-mix(in srgb, var(--accent) 20%, var(--bg-surface));
      border-color: var(--accent);
      color: var(--accent);

      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 0;
      background: transparent;
      color: var(--muted);

      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;

    .x:hover { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }

    .empty { color: var(--muted); text-align: center; padding: 14px 8px; font-size: 13.5px; }

    /* Utility Footer in List Panel */
    .list-utils {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 6px;

      gap: 4px;
      background: var(--bg-inset);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);

    .tab-btn {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;

      background: var(--bg-surface);
      color: var(--fg);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14);

    .hist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 10px;
      background: var(--bg-inset);
      font-size: 13px;

    .hist-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .hist-win { font-weight: 600; overflow-wrap: anywhere; }
    .hist-meta { color: var(--muted); font-size: 11.5px; flex: none; font-variant-numeric: tabular-nums; }

    /* ==========================================================================
       Celebratory Winner Modal + Confetti
       ========================================================================== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 14, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: grid;
      place-items: center;
      z-index: 40;
      padding:
        max(16px, env(safe-area-inset-top, 0px))
        max(16px, env(safe-area-inset-right, 0px))
        max(16px, env(safe-area-inset-bottom, 0px))
        max(16px, env(safe-area-inset-left, 0px));
    }

    #confettiCv {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .popup {
      position: relative;
      z-index: 1;
      background: var(--popup-bg);
      border: 1.5px solid color-mix(in srgb, var(--accent) 60%, transparent);
      border-radius: 26px;
      padding: 28px 24px 24px;
      width: min(390px, 100%);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 42px -8px var(--accent-glow);
      animation: pop 0.36s cubic-bezier(0.2, 1.4, 0.4, 1);
    }

    .popup .label {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
      color: var(--accent);
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }

    .popup .win {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(28px, 6vw, 38px);
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    .popup img {
      width: 180px;
      height: 180px;
      max-width: 100%;
      object-fit: cover;
      border-radius: 18px;
      border: 3px solid var(--accent);
    }

    .popup .row { justify-content: center; width: 100%; margin-top: 4px; }

    @keyframes pop {
      from { transform: scale(0.76) translateY(12px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    @media (max-width: 540px) {
      .stage-card, .panel { padding: 14px; border-radius: 20px; }

      .grid.boxes { gap: 10px; padding: 12px; }

    @media (prefers-reduced-motion: reduce) {

        animation: none !important;
      }
      .chip, .pick, .action { transition: none !important; }

      // ---------- Shared Canvas Sizing ----------
      let dpr = 1, wSize = 320, bSize = 320;

      function drawAll() {
        if (!$("stage-wheel").hidden) drawWheel();
        if (!$("stage-bottle").hidden) drawBottle();

      function drawPhoto(ctx, item, px, py, d, spinAngle) {
        const im = getImg(item);
        ctx.save();
        ctx.beginPath(); ctx.arc(px, py, d / 2, 0, TAU); ctx.fillStyle = "#ffffff"; ctx.fill();
        ctx.beginPath(); ctx.arc(px, py, d / 2 - 2, 0, TAU); ctx.clip();

      function themeColors() {
        const cs = getComputedStyle(document.documentElement);
        return {
          accent: cs.getPropertyValue("--accent").trim() || "#ffc94a",
          felt1: cs.getPropertyValue("--felt-1").trim() || "#17463a",
          felt2: cs.getPropertyValue("--felt-2").trim() || "#0d2b22",
          inset: cs.getPropertyValue("--bg-inset").trim() || "#10131d",

      function emptyMessage(ctx, size, text) {
        const c = size / 2, tc = themeColors();

        ctx.fillStyle = tc.muted;

        ctx.textAlign = "center"; ctx.textBaseline = "middle";

      // ---------- Weighted Wheel Helpers ----------
      function wheelSlices(arr) {
        const totalW = arr.reduce((s, it) => s + wheelWeight(it), 0);
        let acc = 0;
        return arr.map((it) => {
          const w = wheelWeight(it);
          const span = (w / totalW) * TAU;
          const start = acc;
          acc += span;
          return { item: it, weight: itemWeight(it), start, span, end: acc };
        });
      }

      function wheelIndexAt(r) {
        const arr = wheelItems();
        if (!arr.length) return 0;
        const slices = wheelSlices(arr);
        let a = (-r) % TAU;
        if (a < 0) a += TAU;
        for (let i = 0; i < slices.length; i++) {
          if (a >= slices[i].start && a < slices[i].end) return i;
        }
        return slices.length - 1;
      }

      function drawWheel() {
        const ctx = wctx, size = wSize, arr = wheelItems(), n = arr.length;
        const tc = themeColors();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, size, size);
        const c = size / 2, bezelR = c - 4, R = c - 18;

        // Metallic bezel

        if (state.theme === "light") {
          bezelGrad.addColorStop(0, "#d6d9e4"); bezelGrad.addColorStop(0.5, "#b7bccb"); bezelGrad.addColorStop(1, "#cfd3df");
        } else if (state.theme === "neon") {
          bezelGrad.addColorStop(0, "#3b1d6a"); bezelGrad.addColorStop(0.5, "#190c33"); bezelGrad.addColorStop(1, "#4a1c6e");
        } else {
          bezelGrad.addColorStop(0, "#3b415c"); bezelGrad.addColorStop(0.5, "#1e2234"); bezelGrad.addColorStop(1, "#323850");

          const sa = (s * TAU) / 16;
          ctx.beginPath();
          ctx.arc(c + Math.cos(sa) * studR, c + Math.sin(sa) * studR, 2.6, 0, TAU);
          ctx.fillStyle = tc.accent;
          ctx.globalAlpha = s % 2 === 0 ? 1 : 0.45;
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        if (n === 0) return emptyMessage(ctx, size, t().addToPlay);

        const slices = wheelSlices(arr);
        const fontName = state.lang === "ar" ? "Cairo" : "Figtree";

        slices.forEach((sl, i) => {
          const a0 = rot + sl.start - Math.PI / 2;
          const a1 = a0 + sl.span;
          const mid = a0 + sl.span / 2;
          const col = colorFor(i, n);

          ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, R, a0, a1); ctx.closePath();
          ctx.fillStyle = col; ctx.fill();
          if (n > 1) { ctx.strokeStyle = "rgba(12,14,22,.3)"; ctx.lineWidth = 2; ctx.stroke(); }

          const item = sl.item;
          if (item.type === "photo") {
            const maxBySeg = n === 1 ? R * 0.88 : Math.sin(Math.min(sl.span / 2, Math.PI / 2)) * R * 0.62 * 2;
            const d = Math.max(18, Math.min(R * 0.42, maxBySeg));
            const pr = n === 1 ? 0 : R - d / 2 - 10;
            drawPhoto(ctx, item, c + Math.cos(mid) * pr, c + Math.sin(mid) * pr, d, mid + Math.PI / 2);
          } else {
            ctx.save();
            ctx.translate(c, c); ctx.rotate(mid);
            const fs = Math.max(11, Math.min(21, (R * sl.span) / 2.35, 25 - n * 0.35));
            ctx.font = "700 " + fs + "px " + fontName + ", system-ui, sans-serif";
            ctx.fillStyle = inkFor(col); ctx.textAlign = "right"; ctx.textBaseline = "middle";
            const rawTxt = item.value + (sl.weight > 1 ? (state.game === "knockout" ? " 🛡" + sl.weight : " ×" + sl.weight) : "");
            let txt = rawTxt;
            const maxW = R * 0.7;
            while (txt.length > 1 && ctx.measureText(txt).width > maxW) txt = txt.slice(0, -1);
            if (txt !== rawTxt) txt = txt.slice(0, -1) + "…";
            if (n === 1) { ctx.rotate(-mid); ctx.textAlign = "center"; ctx.fillText(txt, 0, -R * 0.45); }

        ctx.strokeStyle = tc.accent; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.beginPath(); ctx.arc(c, c, R * 0.08, 0, TAU); ctx.fillStyle = tc.accent; ctx.fill();
      }

      function spinWheel() {
        const arr = wheelItems(), n = arr.length;
        if (busy || !n) return;
        busy = true; refreshAction(); setStatus(t().spinning);
        const slices = wheelSlices(arr);
        const win = weightedRandIndex(arr, wheelWeight);
        const sl = slices[win];
        const a = sl.start + (0.15 + Math.random() * 0.7) * sl.span;
        const delta = ((-a - rot) % TAU + TAU) % TAU;
        const start = rot;
        const spins = Math.max(3, Math.round((5 + randInt(3)) * speedMult()));
        const total = spins * TAU + delta;
        const dur = reduceMotion() ? 550 : (4600 + Math.random() * 1000) * speedMult();
        const t0 = performance.now();
        let lastIdx = wheelIndexAt(rot);

        (function frame(now) {
          const p = Math.min(1, (now - t0) / dur);
          const e = 1 - Math.pow(1 - p, 4);
          rot = start + total * e;
          const idx = wheelIndexAt(rot);
          if (idx !== lastIdx) { lastIdx = idx; tick(); }
          drawWheel();
          if (p < 1) requestAnimationFrame(frame);
          else {
            rot %= TAU;
            if (state.game === "knockout") koLanded(win);
            else finishWin(win);
          }

      // ---------- Race ----------
      let raceField = [];

          const r = document.createElement("div"); r.className = "runner"; r.style.background = colorFor(i, raceField.length);

      function raceGo() {
        if (busy || raceField.length < 2) return;
        busy = true; refreshAction(); setStatus(t().offRace);
        const lanes = Array.from($("track").querySelectorAll(".lane"));
        const runners = lanes.map((l) => l.querySelector(".runner"));
        lanes.forEach((l) => l.classList.remove("won"));
        const dist = Math.max(40, lanes[0].clientWidth - 34);
        const w = weightedRandIndex(raceField);
        const base = reduceMotion() ? 1.0 : 4.8 * speedMult();
        const plans = raceField.map((_, i) => {
          const T = i === w ? base : base * (1.05 + Math.random() * 0.25);
          const ws = Array.from({ length: 6 }, () => 0.5 + Math.random());
          const sum = ws.reduce((a, b) => a + b, 0); let acc = 0;
          const cum = [0].concat(ws.map((x) => (acc += x) / sum));
          return { T, cum };
        });

          const f = Math.min(1, sec / pl.T) * 6, k = Math.min(5, Math.floor(f));

          if (sec - lastHoof > 0.16) { lastHoof = sec; clack(); }

      // ---------- Order ----------

      // ---------- 3 Cards ----------
      let threeReady = false;

      function threePlaceholder() {

      function threeDeal() {
        if (busy || items().length < 2) return;
        busy = true; threeReady = false; refreshAction(); setStatus(t().rememberCards);
        const picks = shuffled(weightedShuffle(items()).slice(0, 3)), m = picks.length, box = $("three"); box.innerHTML = "";
        const els = picks.map((item, i) => {
          const b = document.createElement("button");

        const slots = els.map((_, i) => i);

        setTimeout(() => {
          els.forEach((e) => e.classList.remove("open")); tone(500, 0.1, "triangle", 0.08);

        else if (g === "three") threeDeal();
